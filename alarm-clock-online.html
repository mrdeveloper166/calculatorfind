    <script>
        //var alarmTime={'h':0, 'm':0, 's':0};
        var alarmTime = {
            'h': 0,
            'm': 0,
            'ampm': 'AM',
            'h24': 0
        };
        var options = {
            hours12: true,
            showSec: true,
            soundAlarm: false,
            vibration: false,
            textAlert: false,
            timeTitle: false
        };
        var prev_s = 0;
        var audio, playcount = 0;

        $(document).on('pagecreate', function() {
            $(":jqmData(role='page')").attr("data-title", document.title);
            var myVar = setInterval(function() {
                myTimer();
            }, 1000);

            $("#shortbtn").click(function(e) {
                var x, y, s;
                x = $(window).width() - 400;
                y = 20;
                $("#short_div").popup("open", {
                    arrow: true,
                    x: x,
                    y: y
                });
                var browser = get_browser();
                var os = GetOS();
                if (os == "iOS") {
                    s = "Add to home screen:\n";
                    s += "<ol>";
                    s += "<li>Click the Share button&nbsp&nbsp<img src=\"glyphicons_halflings_065_share.png\">.</li>";
                    s += "<li>Select <b>Add to Home Screen</b>.</li>";
                    s += "</ol>";
                } else if (os == "Android") {
                    s = "Add to home screen:\n";
                    s += "<ol>";
                    s += "<li>Click the Settings button&nbsp&nbsp<img src=\"glyphicons_halflings_011_3dot.png\">.</li>";
                    s += "<li>Click the Star button&nbsp&nbsp<img src=\"glyphicons_halflings_006_star-empty.png\">.</li>";
                    s += "<li>Select <b>Add shortcut to home screen</b>.</li>";
                    s += "</ol>";
                } else if (browser == 'Chrome') {
                    s = "Add to desktop:\n";
                    s += "<ol>";
                    s += "<li>Click the Chrome menu&nbsp&nbsp<img src=\"bars-black.png\">.</li>";
                    s += "<li>Select <b>Tools</b>.</li>";
                    s += "<li>Select <b>Create application shortcuts</b>.</li>";
                    s += "</ol>";
                } else if (browser == 'Firefox') {
                    s = "Add to desktop:\n";
                    s += "Drag the address bar icon <img src=\"glyphicons_halflings_134_globe.png\"> to the desktop.";
                }
                $("#short_div").html(s);
            });

            $("#stopbtn").click(function() {
                stopSound();
            });
            $("#upbtn1").click(function() {
                if (options.hours12) {
                    if (++alarmTime.h == 13) alarmTime.h = 1;
                } else {
                    if (++alarmTime.h == 24) alarmTime.h = 0;
                }
                timeView();
            });
            $("#upbtn2").click(function() {
                if (++alarmTime.m == 60) alarmTime.m = 0;
                timeView();
            });
            $("#upbtn3").click(function() {
                //if( ++alarmTime.s==60 ) alarmTime.s = 0;
                if (alarmTime.ampm == 'AM') alarmTime.ampm = 'PM';
                else if (alarmTime.ampm == 'PM') alarmTime.ampm = 'AM';
                timeView();
            });
            $("#dnbtn1").click(function() {
                if (options.hours12) {
                    if (--alarmTime.h < 1) alarmTime.h = 12;
                } else {
                    if (--alarmTime.h < 0) alarmTime.h = 23;
                }
                timeView();
            });
            $("#dnbtn2").click(function() {
                if (--alarmTime.m < 0) alarmTime.m = 59;
                timeView();
            });
            $("#dnbtn3").click(function() {
                //	if( --alarmTime.s<0 ) alarmTime.s = 59;
                if (alarmTime.ampm == 'AM') alarmTime.ampm = 'PM';
                else if (alarmTime.ampm == 'PM') alarmTime.ampm = 'AM';
                timeView();
            });

            $("#s1").change(function() {
                var i = $("#s1").prop("selectedIndex");
                if (i == 0) {
                    options.soundAlarm = false;
                    $("#alarmicon").hide();
                } else {
                    options.soundAlarm = true;
                    $("#alarmicon").show();
                }
            });
            $("#s2").change(function() {
                var i = $("#s2").prop("selectedIndex");
                if (i == 0)
                    options.vibration = false;
                else
                    options.vibration = true;
            });
            $("#tb").change(function() {
                var txt = $("#tb").val();
                if (txt == '')
                    options.textAlert = false;
                else
                    options.textAlert = true;
            });
            $("#s3").change(function() {
                var i = $("#s3").prop("selectedIndex");
                if (i == 0) { // 12hr
                    options.hours12 = true;
                    $("#ampm").show();
                    $("#alarm tr td:nth-child(5)").show();
                } else { // 24hr
                    options.hours12 = false;
                    $("#ampm").hide();
                    $("#alarm tr td:nth-child(5)").hide();
                }
            });
            $("#s4").change(function() {
                var i = $("#s4").prop("selectedIndex");
                if (i == 0) { // hh:mm
                    options.showSec = false;
                } else { // hh:mm:ss
                    options.showSec = true;
                    $("#s5").prop("selectedIndex", 1);
                    $("#s5").selectmenu("refresh");
                }
            });
            $("#s5").change(function() {
                var i = $("#s5").prop("selectedIndex");
                if (i == 1) { //on
                    $("#s4").prop("selectedIndex", 0);
                    $("#s4").selectmenu("refresh");
                    $("#s6").prop("selectedIndex", 5);
                    $("#s6").selectmenu("refresh");
                    $('#s6').trigger("change");
                    options.showSec = false;
                }
            });
            $("#s6").change(function() {
                var i = $("#s6").prop("selectedIndex");
                var color = ['#333333', 'blue', 'lime', 'greenyellow', 'red', 'silver', 'white', 'yellow'];
                var bgcolor = ['#f9f9f9', '#333333', '#333333', '#333333', '#333333', '#333333', '#333333', '#333333'];
                $(".ui-page").css('color', color[i]);
                $(".ui-page").css('background-color', bgcolor[i]);
            });
            $("#s7").change(function() {
                var i = $("#s7").prop("selectedIndex");
                var font = ["Arial", "Comic Sans MS", "Courier New", "digital-7", "digital-7i", "Impact", "Lucida Sans Unicode"];
                $("#clock, #alarm").css('font-family', font[i]);
            });
            $("#s8").change(function() {
                var filename = ['Alarm clock.mp3', 'Digital Notification.mp3', 'Notification Alarm.mp3'];
                var i = $("#s8").prop("selectedIndex");
                file = 'audio/' + filename[i];
                audio.src = file;
                audio.load();
            });
            $("#tb2").change(function() {
                var volume = $("#tb2").val() / 100.0;
                audio.volume = volume;
                //audio.load();
            });
            $("#testbtn1").click(function() {
                playSound();
            });
            $("#testbtn2").click(function() {
                stopSound();
            });

            var file = "audio/Alarm clock.mp3";
            audio = new Audio(file);
            audio.volume = 0.5;
            //audio.load();
            audio.addEventListener("ended", function() {
                if (++playcount < 6)
                    audio.play();
                else
                    playcount = 0;
            });

            //setTimeout(function(){ options.timeTitle=true; openAlert(); }, 1000);       
            setTimeout(function() {
                options.timeTitle = true;
            }, 10000);

            $("#alarmicon").hide();

            //$("#three ul").listview("refresh");
        });

        function myTimer() {
            var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            var d = new Date();
            //var d = Date.now();
            //var t = d.toLocaleString();
            //var time = d.toLocaleTimeString();
            var h = d.getHours();
            var m = d.getMinutes();
            var s = d.getSeconds();
            var ampm = '';
            var h24 = h;
            if (options.hours12) {
                ampm = "AM";
                if (h > 11) ampm = "PM";
                if (h > 12) h -= 12;
            }
            var time = h + ":" + pad(m);
            if (options.showSec) time += ":" + pad(s);

            var wday = days[d.getDay()];
            var date = wday + ' ' + d.toLocaleDateString();
            $("#time").html(time);
            $("#ampm").html(ampm);
            $("#date").html(date);
            if (options.timeTitle)
                document.title = time + ' ' + ampm;
            if (s < prev_s) {
                if (h24 == alarmTime.h24 && m == alarmTime.m) {
                    if (options.vibration) vibrate();
                    if (options.soundAlarm) playSound();
                    //if( options.textAlert ) openAlert(h+":"+pad(m)+ampm);
                    openAlert(h + ":" + pad(m) + ampm);
                }
            }
            prev_s = s;
        }

        function vibrate() {
            navigator.vibrate = navigator.vibrate || navigator.webkitVibrate || navigator.mozVibrate || navigator.msVibrate;
            if (navigator.vibrate) {
                navigator.vibrate([500, 300, 100]);
            }
        }

        function playSound() {
            audio.currentTime = 0;
            audio.play();
        }

        function stopSound() {
            audio.pause();
            audio.currentTime = 0;
        }

        function pad(x) {
            return (x < 10 ? '0' : '') + x;
        }

        function openAlert(time) {
            var x, y;
            x = $(window).width() / 2;
            y = $(window).height() - 170;
            txt = encodeURIComponent($("#tb").val());
            if (txt == "") txt = "Alarm!";
            $("#alert_div p:first-child").html(time + ' ' + txt);
            $("#alert_div").popup("open", {
                arrow: true,
                x: x,
                y: y
            });
            //$("#stopbtn").show();
        }

        function timeView() {
            alarmTime.h24 = alarmTime.h;
            if (options.hours12 && alarmTime.h < 12 && alarmTime.ampm == "PM") alarmTime.h24 += 12;
            $("#hours").html(pad(alarmTime.h));
            $("#minutes").html(pad(alarmTime.m));
            $("#ampm2").html(alarmTime.ampm);
            $("#s1").val("on").slider("refresh");
            $("#alarmicon").show();
            options.soundAlarm = true;
        }
    </script>
