    <script>
        function OnPhaseChange() {
            var iphase = document.calcform.phase.selectedIndex;
            var row1 = document.getElementById("row1");
            if (iphase == 0) {
                row1.style.display = 'none';
            } else {
                row1.style.display = '';
            }
        }

        function convert(x1, x2) {
            var iphase = document.calcform.phase.selectedIndex;
            var ivolt = document.calcform.volt.selectedIndex;
            var kva = x1 * x2 / 1000;
            if (iphase == 1) {
                if (ivolt == 0)
                    kva *= Math.sqrt(3);
                else
                    kva *= 3;
            }
            kva = kva.toFixed(3);
            return kva;
        }
    </script>
