<body>
    <div data-role="page" class="ui-responsive-panel">
        <div data-role="header" id="header">

            <h1>Stopwatch</h1>
        </div>

        <div role="main" class="ui-content" id="main">
            <div id="box">
                <br>
                <div id="time"></div>
                <div id="buttons">
                    <form>
                        <a href="#" id="b1" data-role="button" data-icon="clock" class="green">Start</a>
                        <a href="#" id="b2" data-role="button" data-icon="delete">Reset</a>
                    </form>
                </div>
                <div id="listdiv">
                    <ol data-role="listview" data-split-icon="delete" data-split-theme="a" data-inset="true" id="list">
                        <!--<li><a href="#">00:00 99:99</a><a href="#">Purchase album</a></li>-->
                    </ol>
                </div>
            </div>
        </div>

        <script>
            var stopwatch;
            $(document).on('pagecreate', function() {
                $(":jqmData(role='page')").attr("data-title", document.title);
                $("#time").html("00:00:00.0");

                var Stopwatch = function(viewFunc, options) {
                    var interval;
                    var clock;
                    var update_time, prev_update_time;
                    var stop_time;
                    var state;
                    var states = {
                        "init": 0,
                        "stop": 1,
                        "run": 2
                    };

                    // default options
                    options = options || {};
                    options.delay = options.delay || 1;

                    reset();

                    function start() {
                        update_time = prev_update_time = Date.now();
                        interval = setInterval(update, options.delay);
                        state = states.run;
                    }

                    function stop() {
                        stop_time = Date.now();
                        clearInterval(interval);
                        clock += (stop_time - update_time);
                        state = states.stop;
                    }

                    function reset() {
                        clearInterval(interval);
                        clock = 0;
                        stop_time = 0;
                        document.title = "Stopwatch | Online Stopwatch";
                        state = states.init;
                    }

                    function getState() {
                        return state;
                    }

                    function getTime() {
                        var now = Date.now();
                        var time = clock + (now - update_time);
                        return time;
                    }

                    function update() {
                        update_time = Date.now();
                        //clock+=options.delay;
                        clock += update_time - prev_update_time;
                        prev_update_time = update_time;
                        viewFunc(clock);
                    }
                    // public api
                    this.start = start;
                    this.stop = stop;
                    this.reset = reset;
                    this.getState = getState;
                    this.states = states;
                    this.getTime = getTime;
                };

                function pad(x) {
                    return (x < 10 ? '0' : '') + x;
                }

                function updateView(ms) {
                    var h, m, s;
                    s = Math.floor(ms / 1000);
                    ms -= s * 1000;
                    m = Math.floor(s / 60);
                    s -= m * 60;
                    h = Math.floor(m / 60);
                    m -= h * 60;
                    ms = Math.floor((ms + 50) / 100);
                    if (ms == 10) {
                        ms = 0;
                        if (++s == 60) {
                            s = 0;
                            if (++m == 60) {
                                m = 0;
                                h++;
                            }
                        }
                    }
                    h = pad(h);
                    m = pad(m);
                    s = pad(s);
                    time = h + ':' + m + ':' + s + '.' + ms;
                    $("#time").html(time);
                    document.title = time;
                }

                var options = {
                    'delay': 100
                };
                timer = new Stopwatch(updateView, options);

                $("#b1").click(function() {
                    if (timer.getState() == timer.states.init || timer.getState() == timer.states.stop) {
                        timer.start();
                        $("#b1").text('Stop');
                        $("#b1").toggleClass("green");
                        $("#b1").toggleClass("red");
                        $("#b2").text('Split');
                        $("#b2").removeClass('ui-icon-delete');
                        $("#b2").addClass('ui-icon-edit');
                    } else if (timer.getState() == timer.states.run) {
                        timer.stop();
                        $("#b1").text('Continue');
                        $("#b1").toggleClass("red");
                        $("#b1").toggleClass("green");
                        $("#b2").text('Reset');
                        $("#b2").removeClass('ui-icon-edit');
                        $("#b2").addClass('ui-icon-delete');
                    }
                });

                $("#b2").click(function() {
                    if (timer.getState() == timer.states.stop) //reset
                    {
                        timer.reset();
                        clearList();
                        $("#time").html("00:00:00.0");
                        $("#b1").text('Start');
                        $("#b1").removeClass("red");
                        $("#b1").addClass("green");
                    } else if (timer.getState() == timer.states.run) //split
                    {
                        s = "<li>" +
                            "<a href=\"#\">" + time + "</a>" +
                            "<a href=\"#\">Delete</a>" +
                            "</li>";
                        $("#list").append(s).listview("refresh");
                        $("#list li:last a:last").click(function() {
                            if (this == null) return;
                            $(this).parent().remove();
                        });
                    }
                });
            });

            function clearList() {
                var length = $("#list li").length;
                for (var k = 1; k <= length; k++) {
                    var obj = $("#list li:first-child");
                    if (obj == null) return;
                    $(obj).remove();
                }
            }
        </script>
