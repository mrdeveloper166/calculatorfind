    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script>
        var irow = 0;
        $(document).ready(function() {
            $("#qnum").on("blur", function() {
                OnCalc()
            });
            $("#wnum").on("input", function() {
                OnCalc()
            });
            OnCalc();
        });

        function OnReset() {
            document.getElementById("wnum").value = "0";
            OnCalc();
        }

        function OnWrong() {
            var qnum = document.getElementById("qnum").value;
            if (qnum == "") qnum = 10;
            var wnum = document.getElementById("wnum").value;
            qnum = parseInt(qnum);
            wnum = parseFloat(wnum);
            if (wnum >= qnum) return;
            wnum++;
            document.getElementById("wnum").value = wnum;
            OnCalc();
        }

        function OnCalc() {
            var qnum = document.getElementById("qnum").value;
            if (qnum == "") qnum = 10;
            var wnum = document.getElementById("wnum").value;
            qnum = parseInt(qnum);
            wnum = parseFloat(wnum);
            var rnum = qnum - wnum;
            document.getElementById("frac").value = rnum + "/" + qnum;
            var per = (100 * rnum / qnum).toString();
            if (per.indexOf(".") !== -1) {
                per = parseFloat(per);
                per = per.toFixed(2)
            };
            document.getElementById("percent").value = per;
            var letter;
            if (per >= 90) letter = "A";
            else if (per >= 80) letter = "B";
            else if (per >= 70) letter = "C";
            else if (per >= 60) letter = "D";
            else letter = "F";
            document.getElementById("letter").value = letter;
            DrawTable(qnum);
        }

        function DrawTable(qnum) {
            var grade, letter;
            $("#tbl").find("tr:gt(0)").remove();
            for (var i = qnum; i >= 0; i--) {
                grade = 100 * (qnum - i) / qnum;
                grade = grade.toFixed(0);
                if (grade >= 90) letter = "A";
                else if (grade >= 80) letter = "B";
                else if (grade >= 70) letter = "C";
                else if (grade >= 60) letter = "D";
                else letter = "F";
                $('#tbl tr').eq(qnum - i).after("<tr>\
            <td>" + qnum + "</td>\
            <td>" + i + "</td>\
            <td>" + grade + "</td>\
            <td>" + letter + "</td>\
         </tr>");
            }
            $("#tbl").show();
        }
    </script>
